<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Festa della Mamma</title>

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;

            /* SFONDO CON LA TUA IMMAGINE */
            background: url('INSERISCI_LINK_IMMAGINE_FIORI') repeat;
            background-size: 350px;
            padding: 40px;
        }

        /* Pannello del titolo */
        .title-panel {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            padding: 20px;
            max-width: 700px;
            margin: 0 auto 40px auto;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
            border: 2px solid #ffb3d9;
        }

        .title-panel h1 {
            color: #d63384;
            font-size: 42px;
            margin: 0;
            text-shadow: 0 0 10px #ffb3d9;
        }

        /* Pannello principale */
        .panel {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 18px;
            padding: 25px;
            margin: 40px auto;
            max-width: 1000px;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
            border: 2px solid #ffb3d9;
        }

        /* Griglia foto */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .photo-grid img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(255, 105, 180, 0.5);
        }

        /* Testo descrizione */
        .text-box {
            font-size: 18px;
            color: #444;
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Titolo -->
    <div class="title-panel">
        <h1>🌸 Buona Festa della Mamma 🌸</h1>
    </div>

    <!-- Pannello unico con 5 foto + descrizione -->
    <div class="panel">

        <!-- Griglia foto -->
        <div class="photo-grid">
            <img src="LINK_FOTO_1">
            <img src="LINK_FOTO_2">
            <img src="LINK_FOTO_3">
            <img src="LINK_FOTO_4">
            <img src="LINK_FOTO_5">
        </div>

        <!-- Descrizione unica -->
        <div class="text-box">
            <h2>Il nostro ricordo</h2>
            <p>
                Qui puoi raccontare la storia che unisce tutte queste foto:  
                un momento speciale, un ricordo importante,  
                qualcosa che vuoi condividere con lei in questo giorno speciale.
            </p>
        </div>

    </div>

</body>
</html>
