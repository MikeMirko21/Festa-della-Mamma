<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Festa della Mamma</title>

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: url('https://images.unsplash.com/photo-1524253482453-3fed8d2fe12b') no-repeat center/cover;
            backdrop-filter: blur(3px);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #d63384;
            font-size: 42px;
            text-shadow: 0 0 10px #ffb3d9;
        }

        .panel {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 18px;
            padding: 25px;
            margin: 40px auto;
            max-width: 900px;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
            border: 2px solid #ffb3d9;
        }

        .photo-section {
            display: flex;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap;
        }

        .photo-section img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
        }

        .text-box {
            flex: 1;
            font-size: 18px;
            color: #444;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <h1>🌸 Buona Festa della Mamma 🌸</h1>

    <div class="panel">
        <div class="photo-section">
            <img src="INSERISCI_LINK_FOTO" alt="Foto mamma">
            <div class="text-box">
                <h2>Il nostro ricordo</h2>
                <p>
                    Qui puoi raccontare la storia della foto:  
                    un momento speciale, un ricordo importante,  
                    qualcosa che vuoi condividere con lei.
                </p>
            </div>
        </div>
    </div>

</body>
</html>
